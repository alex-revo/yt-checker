name: Yootheme Version Checker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run checker script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: php check.php

      # Этот шаг сохраняет state.json
      - name: Commit state file
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          # Создаем файл, если его нет, чтобы git add не выдавал ошибку
          [ -f state.json ] || echo '{}' > state.json
          git add state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push
